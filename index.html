<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamu Express</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <header>
      <div class="brand">
        <span class="brand-icon">🍽️</span>
        <div>
          <h1>Tamu Express</h1>
          <p class="tagline">Fast, fresh deliveries from campus kitchens</p>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="card form-card">
        <h2>Place Your Order</h2>
        <p class="section-subtitle">Tell us what you are craving and we will bring it to you.</p>
        <form id="orderForm" novalidate>
          <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Jane Doe" required>
          </div>
          <div class="input-grid">
            <div class="input-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="+1 555-123-4567" required>
            </div>
            <div class="input-group">
              <label for="address">Delivery Address</label>
              <input type="text" id="address" placeholder="Dorm, apartment, or building" required>
            </div>
          </div>
          <div class="input-group">
            <label for="orderDetails">Order Details</label>
            <textarea id="orderDetails" placeholder="Add your items, preferences, and delivery notes" required></textarea>
          </div>
          <button type="submit">Submit Order</button>
          <p id="orderMessage" class="feedback" role="alert"></p>
        </form>
      </section>
    </main>
  </div>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/order.js"></script>
</body>
</html>
