<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamu Express Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>📦 Tamu Express Orders</header>

  <div id="statusMessage" style="text-align:center; margin-top:10px; font-weight:bold;">
    Loading orders...
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Order Details</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody id="ordersBody"></tbody>
  </table>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
