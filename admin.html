<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamu Express | Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <h1>Tamu Express Admin</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <main class="container">
    <section class="orders">
      <h2>Placed Orders</h2>
      <table id="ordersTable">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Order</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="ordersList"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>© 2025 Tamu Express | Admin Panel</p>
  </footer>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
